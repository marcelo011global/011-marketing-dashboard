<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>011 Global — Mobile recharge</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="sales.css">
<style>tfoot td{border-top:2px solid var(--line-strong);border-bottom:0} .more{justify-self:start} #tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:20px}</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <a class="logo" href="index.html#/performance"><img src="logo.png" alt="011 Global" class="logo-img"></a>
    <span class="app-name">Marketing</span>
    <a class="nav-btn" href="index.html#/performance">Markets</a>
    <a class="nav-btn" href="index.html#/campaigns">Campaigns</a>
    <a class="nav-btn" href="sales.html">Sales</a>
    <a class="nav-btn" href="vnumber.html">VNUMBER</a>
    <a class="nav-btn" href="enrollments.html">Enrollments</a>
    <a class="nav-btn" href="subscribers.html">Subscribers</a>
    <a class="nav-btn active" href="recharge.html">Recharge</a>
    <a class="nav-btn" href="sims.html">SIMs</a>
  </div>
  <div class="topbar-right">
    <span class="user" id="user-display"></span>
    <button class="btn ghost" type="button" id="signout">Sign out</button>
  </div>
</header>

<div class="gate" id="gate" hidden></div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <div class="brand"><i></i>011 Global · Mobile recharge</div>
      <h1>Mobile recharge revenue</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="upload">
      <p class="note" id="srcnote"></p>
      <button class="btn" type="button" id="pdf" data-report="Mobile recharge report">Download PDF</button>
    </div>
  </header>

  <div class="filters" id="filters" role="group" aria-label="Filters"></div>

  <section class="kpis" id="kpis" aria-label="Key figures"></section>

  <section class="panel">
    <div class="ph"><h2 id="trendTitle"></h2><p class="note">Switch between Monthly and Daily above</p></div>
    <div class="chart"><canvas id="trend"></canvas></div>
  </section>

  <div id="tables"></div>
</div>

<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="report-pdf.js"></script>
<script type="module">
import { initReport } from './reports.js';
initReport({
  title: 'Mobile recharge', coll: 'mkt_mr', months: 12,
  dims: [{ key: 'market', label: 'Market', filter: true }, { key: 'rep', label: 'Rep', filter: true }],
  measures: [{ key: 'amount', label: 'Revenue', fmt: 'usd' }, { key: 'transactions', label: 'Transactions', fmt: 'int' }],
  kpis: (cur, prev, sum) => { const t = sum(cur, 'transactions'); return [{ label: 'Avg per transaction', value: t ? '$' + (sum(cur, 'amount') / t).toFixed(2) : '—' }]; },
});
</script>
</body>
</html>
