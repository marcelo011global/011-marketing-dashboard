<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>011 Global — SIM activations</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="sales.css">
<style>tfoot td{border-top:2px solid var(--line-strong);border-bottom:0} .more{justify-self:start} #tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:20px}</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <a class="logo" href="index.html#/performance"><img src="logo.png" alt="011 Global" class="logo-img"></a>
    <span class="app-name">Marketing</span>
    <a class="nav-btn" href="index.html#/performance">Markets</a>
    <a class="nav-btn" href="index.html#/campaigns">Campaigns</a>
    <a class="nav-btn" href="sales.html">Sales</a>
    <a class="nav-btn" href="vnumber.html">VNUMBER</a>
    <a class="nav-btn" href="enrollments.html">Enrollments</a>
    <a class="nav-btn" href="subscribers.html">Subscribers</a>
    <a class="nav-btn" href="recharge.html">Recharge</a>
    <a class="nav-btn active" href="sims.html">SIMs</a>
  </div>
  <div class="topbar-right">
    <span class="user" id="user-display"></span>
    <button class="btn ghost" type="button" id="signout">Sign out</button>
  </div>
</header>

<div class="gate" id="gate" hidden></div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <div class="brand"><i></i>011 Global · SIM activations</div>
      <h1>SIM activations</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="upload">
      <p class="note" id="srcnote"></p>
      <button class="btn" type="button" id="pdf" data-report="SIM activations report">Download PDF</button>
    </div>
  </header>

  <div class="filters" id="filters" role="group" aria-label="Filters"></div>

  <section class="kpis" id="kpis" aria-label="Key figures"></section>

  <section class="panel">
    <div class="ph"><h2 id="trendTitle"></h2><p class="note">Switch between Monthly and Daily above</p></div>
    <div class="chart"><canvas id="trend"></canvas></div>
  </section>

  <div id="tables"></div>
</div>

<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="report-pdf.js"></script>
<script type="module">
import { initReport } from './reports.js';
initReport({
  title: 'SIM activations', coll: 'mkt_sims', months: 12,
  dims: [{ key: 'plan', label: 'Plan', filter: true }, { key: 'creator', label: 'Creator', filter: true }, { key: 'shipping', label: 'Shipping', filter: true }, { key: 'coupon', label: 'Coupon' }],
  measures: [{ key: 'sims', label: 'SIMs activated', fmt: 'int' }, { key: 'amount', label: 'Revenue', fmt: 'usd' }],
  kpis: (cur, prev, sum) => { const s = sum(cur, 'sims'); return [
    { label: 'Avg revenue per SIM', value: s ? '$' + (sum(cur, 'amount') / s).toFixed(2) : '—' },
    { label: 'Avg plan length', value: s ? Math.round(sum(cur, 'days') / s) + ' days' : '—' },
    { label: 'Coupon discounts', value: '$' + Math.abs(sum(cur, 'couponAmount')).toLocaleString('en-US', { maximumFractionDigits: 0 }) }]; },
});
</script>
</body>
</html>
