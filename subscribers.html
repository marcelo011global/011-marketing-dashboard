<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="sales.css">
<style>tfoot td{border-top:2px solid var(--line-strong);border-bottom:0} .more{justify-self:start} #tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:20px}</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <a class="logo" href="index.html#/performance"><img src="logo.png" alt="011 Global" class="logo-img"></a>
    <span class="app-name">Marketing</span>
    <a class="nav-btn" href="sales.html">Sales</a>
    <a class="nav-btn" href="vnumber.html">VNUMBER</a>
    <a class="nav-btn active" href="subscribers.html">Subscribers</a>
    <a class="nav-btn" href="recharge.html">Recharge</a>
    <a class="nav-btn" href="sims.html">Globusim</a>
    <a class="nav-btn" href="index.html#/performance">Paid media</a>
  </div>
  <div class="topbar-right">
    <span class="user" id="user-display"></span>
    <button class="btn ghost" type="button" id="signout">Sign out</button>
  </div>
</header>

<div class="gate" id="gate" hidden></div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <div class="brand"><i></i>011 Global · Subscribers</div>
      <h1>New subscribers</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="upload">
      <p class="note" id="srcnote"></p>
      <button class="btn" type="button" id="pdf" data-report="Subscribers report">Download PDF</button>
    </div>
  </header>

  <div class="filters" id="filters" role="group" aria-label="Filters"></div>

  <section class="kpis" id="kpis" aria-label="Key figures"></section>

  <section class="panel">
    <div class="ph"><h2 id="trendTitle"></h2><p class="note">Switch between Monthly and Daily above</p></div>
    <div class="chart"><canvas id="trend"></canvas></div>
  </section>

  <div id="tables"></div>
</div>

<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="report-pdf.js"></script>
<script type="module">
import { initReport } from './reports.js?v=202611111615';
initReport({
  title: 'Subscribers', coll: 'mkt_subs',
  // VNUMBER = plans with "Vnumber" in the name. Status groups: Active = Active + Sleeping; Not active = everything else
  // (Not Active, Pre-Suspended, Suspended).
  // Monthly / Prepaid comes from the package report (Sales page data), matched on the plan name.
  packageTypes: true,
  derive: (r, ctx) => { r.line = /vnumber/i.test(String(r.plan || '')) ? 'VNUMBER' : 'Non-VNUMBER';
    r.ptype = ctx.pkgType?.get(String(r.plan || '').trim()) || 'Not in package report';
    r.group = /^(active|sleeping)$/i.test(String(r.status || '').trim()) ? 'Active' : 'Not active'; },
  stack: { key: 'group', series: [{ v: 'Active', label: 'Active (Active + Sleeping)', color: '#3A6EA5' }, { v: 'Not active', label: 'Not active (Not Active + Pre-Suspended + Suspended)', color: '#EE7805' }] },
  dims: [{ key: 'line', label: 'VNUMBER / Non-VNUMBER', filter: true }, { key: 'ptype', label: 'Monthly / Prepaid', filter: true }, { key: 'group', label: 'Status group' }, { key: 'plan', label: 'Plan', filter: true }, { key: 'agent', label: 'Agent', filter: true }, { key: 'creator', label: 'Creator', filter: true },
         { key: 'status', label: 'Status', filter: true }, { key: 'autoTopup', label: 'Auto top-up' }],
  measures: [{ key: 'count', label: 'New subscribers', fmt: 'int' }, { key: 'credit', label: 'Credit balance', fmt: 'usd' }],
  kpis: (cur, prev, sum) => {
    const n = sum(cur, 'count'), act = sum(cur.filter(r => r.group === 'Active'), 'count'), sl = sum(cur.filter(r => r.status === 'Sleeping'), 'count');
    return [{ label: 'Still active', value: n ? (act / n * 100).toFixed(1) + '%' : '—', note: act.toLocaleString('en-US') + ' incl. sleeping' },
            { label: 'Of which sleeping', value: n ? (sl / n * 100).toFixed(1) + '%' : '—', note: sl.toLocaleString('en-US') + ' of them' }];
  },
});
</script>
</body>
</html>
